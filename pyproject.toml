[project]
name = "traceback-agent-k8s"
version = "0.1.0"
description = "Read-only Kubernetes diagnostic MCP server (kube-traceback)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0,<2",
    "kubernetes>=29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
kubetraceback = "kubetraceback.mcp_server:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
