[project]
name = "traceback-agent-k8s"
version = "0.2.1"
description = "Read-only Kubernetes diagnostic MCP server (kube-traceback)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0,<2",
    "kubernetes>=29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.5",
]

[project.scripts]
kubetraceback = "kubetraceback.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
extend-select = ["D300"]