name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test

    # Serialize image deployment runs.
    concurrency:
      group: kubetraceback-docker-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: kube-traceback:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           github.event_name == 'workflow_dispatch')
        timeout-minutes: 15
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          : "${SSH_HOST:?Missing SSH_HOST secret}"
          : "${SSH_USER:?Missing SSH_USER secret}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY secret}"
          : "${SSH_KNOWN_HOSTS:?Missing SSH_KNOWN_HOSTS secret}"
          SSH_PORT="${SSH_PORT:-22}"

          SSH_TASK_DIR="$(mktemp -d)"
          trap 'rm -rf "$SSH_TASK_DIR"' EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$SSH_TASK_DIR/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > "$SSH_TASK_DIR/known_hosts"
          chmod 600 "$SSH_TASK_DIR/key" "$SSH_TASK_DIR/known_hosts"

          SSH_OPTIONS=(
            -i "$SSH_TASK_DIR/key"
            -o "UserKnownHostsFile=$SSH_TASK_DIR/known_hosts"
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          # Check prerequisites before transferring the image.
          ssh "${SSH_OPTIONS[@]}" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          cd /opt/kubetraceback
          test -w .
          test -f compose.yaml
          docker info > /dev/null
          docker compose version
          docker compose config -q
          REMOTE

          docker save kube-traceback:ci | gzip \
            > "$SSH_TASK_DIR/image.tar.gz"

          scp "${SSH_OPTIONS[@]}" \
            -P "$SSH_PORT" \
            "$SSH_TASK_DIR/image.tar.gz" \
            "$SSH_USER@$SSH_HOST:/opt/kubetraceback/image.tar.gz"

          ssh "${SSH_OPTIONS[@]}" \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          cd /opt/kubetraceback
          docker load -i image.tar.gz
          rm -f image.tar.gz
          docker compose up -d \
            --no-build \
            --force-recreate \
            --wait \
            --wait-timeout 120 \
            mcp
          docker compose ps
          REMOTE